<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prayer First — Start Your Day With God</title>
  <meta name="description" content="Prayer First locks your distracting apps until you've spent time in prayer. Build the daily habit that changes everything." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:  #FAF9F6;
      --forest: #2C3E2D;
      --sage:   #7D9B76;
      --gold:   #D4A574;
      --muted:  #6B7B6C;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--forest);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      width: 100%;
      animation: fade 1.4s ease-out both;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── LEFT ── */
    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px clamp(32px, 6vw, 88px);
      max-width: 720px;
      margin-left: auto;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 56px;
      padding: 10px 20px 10px 10px;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(44,62,45,0.06);
      border-radius: 100px;
      backdrop-filter: blur(8px);
      align-self: flex-start;
      box-shadow: 0 4px 16px rgba(44,62,45,0.04);
    }

    .mark img {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      box-shadow: 0 4px 12px rgba(44,62,45,0.15);
    }

    .mark span {
      font-family: 'Lora', serif;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      color: var(--forest);
    }

    h1 {
      font-family: 'Lora', serif;
      font-weight: 500;
      font-size: clamp(2.4rem, 5vw, 4rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--forest);
      margin-bottom: 20px;
    }

    h1 em {
      font-style: italic;
      color: var(--gold);
    }

    h1 em.sage { color: var(--sage); }

    .tagline {
      font-family: 'Lora', serif;
      font-size: clamp(1.35rem, 2vw, 1.6rem);
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 44px;
      max-width: 520px;
    }

    .tagline em {
      font-style: italic;
      color: var(--gold);
    }

    .app-store-btn {
      display: inline-block;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .app-store-btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .app-store-btn img { height: 56px; display: block; }

    .note {
      display: block;
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* ── RIGHT (panel) ── */
    .demo {
      background: linear-gradient(160deg, #3A5240, var(--forest));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 40px;
      min-height: 600px;
    }

    .demo video,
    .demo .demo-placeholder {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9 / 19.5;
      border-radius: 36px;
      background: rgba(250,249,246,0.05);
      box-shadow:
        0 40px 80px rgba(0,0,0,0.35),
        0 12px 24px rgba(0,0,0,0.15);
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lora', serif;
      font-style: italic;
      color: rgba(250,249,246,0.5);
      font-size: 0.9rem;
      text-align: center;
      padding: 24px;
    }

    /* ── FOOTER ── */
    footer {
      padding: 32px 24px;
      text-align: center;
      background: var(--cream);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .footer-links a {
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--forest); }

    .footer-copy {
      font-size: 0.78rem;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .copy {
        padding: 56px 28px 40px;
        margin: 0 auto;
        text-align: center;
        align-items: center;
      }
      .mark { justify-content: center; }
      .tagline { margin-left: auto; margin-right: auto; }
      .demo { padding: 48px 28px; min-height: 0; }
      .demo video, .demo .demo-placeholder { max-width: 260px; }
    }
  </style>
</head>
<body>

  <main>
    <div class="copy">
      <div class="mark">
        <img src="logo.png" alt="Prayer First" />
        <span>Prayer First</span>
      </div>

      <h1>first <em>light.</em><br />first <em>thought.</em></h1>

      <p class="tagline">let the first thing you reach for be <em>prayer.</em></p>

      <a class="app-store-btn" href="https://apps.apple.com/app/idYOUR_APP_ID" target="_blank" rel="noopener">
        <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store" />
      </a>
    </div>

    <div class="demo">
      <div class="demo-placeholder">coming soon</div>
    </div>
  </main>

  <footer>
    <nav class="footer-links">
      <a href="terms.html">Terms of Service</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>
    <div class="footer-copy">© 2026 Prayer First. All rights reserved.</div>
  </footer>

</body>
</html>
